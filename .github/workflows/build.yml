name: Build Android App (APK & AAB & SHA)
on: [push, workflow_dispatch]
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
    - run: gradle assembleDebug bundleDebug
    - run: |
        mkdir -p output_artifacts
        cp app/build/outputs/apk/debug/app-debug.apk output_artifacts/KAZA_NAMAZI_AS_STANI_debug.apk
        cp app/build/outputs/bundle/debug/app-debug.aab output_artifacts/KAZA_NAMAZI_AS_STANI_debug.aab
        cd output_artifacts
        sha256sum KAZA_NAMAZI_AS_STANI_debug.apk KAZA_NAMAZI_AS_STANI_debug.aab > checksums.txt
        cat checksums.txt
    - uses: actions/upload-artifact@v4
      with:
        name: KAZA_NAMAZI_AS_STANI-apk-aab-and-sha
        path: output_artifacts/
