name: Build Android App (APK & AAB)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
    - run: gradle assembleDebug bundleDebug
    - run: |
        mkdir -p output_artifacts
        cp app/build/outputs/apk/debug/app-debug.apk output_artifacts/KAZA_NAMAZI_AS_STANI_debug.apk
        cp app/build/outputs/bundle/debug/app-debug.aab output_artifacts/KAZA_NAMAZI_AS_STANI_debug.aab
    - uses: actions/upload-artifact@v4
      with:
        name: KAZA_NAMAZI_AS_STANI-apk-and-aab
        path: output_artifacts/
